<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetCraft core tests</title>
<style>body{font:14px/1.4 system-ui,sans-serif;margin:16px;background:#fff;color:#111}.pass{color:#176b2c}.fail{color:#b00020;font-weight:bold}pre{white-space:pre-wrap}</style>
</head>
<body>
<h1>PetCraft core tests (dev only)</h1>
<pre id="out">running...</pre>
<script type="module">
// Dev-only checks of the simulation core: pets, energy, feeding, Bond, saves.
// Open http://localhost:<port>/tools/tests/core.html. Not shipped.
import { loadData } from '../../js/core/data.js';
import { createInitialState, validateState } from '../../js/core/state.js';
import { createGame } from '../../js/core/game.js';
import { parseSave } from '../../js/core/save.js';
import { petMaxEnergy, petDrainPerHour } from '../../js/systems/petstats.js';
import { qualityOdds, itemMs, queueSlots } from '../../js/systems/crafting.js';
import { tierCost, upgradeCheck, canUpgradeAny, petCapacity } from '../../js/systems/buildings.js';
import { petRestPerHour } from '../../js/systems/petstats.js';
import { offlineCapMs } from '../../js/core/time.js';
import { pantryList } from '../../js/systems/pets.js';
import { actionMs } from '../../js/systems/harvest.js';

const out = document.getElementById('out');
const lines = [];
let failed = 0;
const H = 3600000;
function check(name, ok, detail = '') {
  if (!ok) failed++;
  lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? `  (${detail})` : ''}`);
}
const sortedJson = (o) => JSON.stringify(Object.keys(o).sort().map((k) => [k, o[k]]));
const near = (a, b, tol) => Math.abs(a - b) <= tol;

// The data files are fetched relative to the page, so load them from the repo root.
const base = new URL('../../', location.href);
const realFetch = window.fetch.bind(window);
window.fetch = (u, o) => realFetch(typeof u === 'string' && u.startsWith('data/') ? new URL(u, base) : u, o);
const data = await loadData();

let clockNow = Date.UTC(2026, 9, 19, 12);
const clock = () => clockNow;

function freshGame(seed = 12345) {
  const s = createInitialState(clockNow);
  s.rng = seed;
  s.workers.player.rng = seed + 1;
  return createGame(data, JSON.parse(JSON.stringify(s)), { clock });
}

function runChunks(game, ms, stepMs) {
  let left = ms;
  while (left > 0) { const t = Math.min(stepMs, left); game.advance(t); left -= t; }
}

try {
  // 1. Migration from a Phase 2 (v2) save.
  const v2 = {
    version: 2, meta: { createdAt: 1, lastSavedAt: 1, launches: 3 }, rng: 99, settings: { music: true, sound: true },
    coins: 0, renown: { rank: 1, xp: 0 }, buildings: { cottage: { tier: 1 } }, skills: { chopping: { level: 4, xp: 10 } },
    bag: { pine_log: 40 }, tools: { axe: { item: 'stone_axe', quality: 'normal' } },
    workers: { player: { task: { zone: 'meadowfold', skill: 'chopping', node: 'pine' }, progressMs: 100 } }, stats: { actions: { chopping: 50 } },
  };
  const mig = parseSave(JSON.stringify(v2));
  check('v2 save migrates to the current version and validates', !!mig.state && mig.state.version === 4, mig.error || '');
  check('migration keeps progress', mig.state?.bag.pine_log === 40 && mig.state?.skills.chopping.level === 4 && mig.state?.workers.player.task?.node === 'pine');
  const g0 = createGame(data, mig.state, { clock });
  check('migrated save needs a starter egg', g0.getState().pets.active.length === 2 && !g0.getState().pets.starter);

  // 2. Hatch the starter.
  const g = freshGame();
  let threw = false;
  try { g.dispatch('pets/hatchStarter', { archetype: 'sprout', name: '   ' }); } catch { threw = true; }
  check('a blank name is refused', threw);
  g.dispatch('pets/hatchStarter', { archetype: 'sprout', name: '  Mossy  <b>  ' });
  const st = g.getState();
  const pid = st.pets.active[0];
  const pet = st.pets.list[pid];
  check('starter hatches Uncommon into slot 1 with a worker', pet && pet.quality === 'uncommon' && !!st.workers[pid] && st.pets.active[1] === null);
  check('name is cleaned', pet.name === 'Mossy b', JSON.stringify(pet.name));
  threw = false;
  try { g.dispatch('pets/hatchStarter', { archetype: 'stone', name: 'Two' }); } catch { threw = true; }
  check('only one starter', threw);

  // 3. A full bar lasts about 3 hours of work, then the pet rests until full.
  g.dispatch('harvest/assign', { worker: pid, zone: 'meadowfold', skill: 'chopping', node: 'pine' });
  const drain = petDrainPerHour(data, pet);
  const fullHours = petMaxEnergy(data, pet) / drain;
  check('full bar = about 3 h of work', near(fullHours, 3, 0.2), `${fullHours.toFixed(2)} h`);
  // No food in the bag: work until 0.
  const logs0 = st.bag.pine_log || 0;
  let worked = 0, rested = 0, wentToRest = false, woke = false;
  const off = g.onEvents((evs) => {
    for (const e of evs) {
      if (e.type === 'petTime' && e.pet === pid) { worked += e.workMs; rested += e.restMs; }
      if (e.type === 'petRest') wentToRest = true;
      if (e.type === 'petWoke') woke = true;
    }
  });
  runChunks(g, 3.2 * H, 60000);
  check('pet goes to rest at 0 energy', wentToRest && pet.resting, `energy ${pet.energy.toFixed(2)}`);
  check('worked about 3 h before resting', near(worked / H, fullHours, 0.15), `${(worked / H).toFixed(3)} h`);
  check('pet harvested logs', (st.bag.pine_log || 0) > logs0, `${(st.bag.pine_log || 0) - logs0} logs`);
  check('pet gained XP / levels', pet.level > 1 || pet.xp > 0, `level ${pet.level}`);
  check('player skill XP untouched by pet work', st.skills.chopping.xp === 0 && st.skills.chopping.level === 1);
  check('work earns Bond (+1 per 30 min)', pet.bond === 6, `bond ${pet.bond}`);
  runChunks(g, 1.2 * H, 60000);
  check('rests about 1 h, wakes full, works again', woke && !pet.resting, `rested ${(rested / H).toFixed(2)} h`);
  check('rest took about 1 h', near(rested / H, petMaxEnergy(data, pet) / 100, 0.02));
  off();

  // 4. Auto-feed from the pantry: cooked meals and tonics only, never raw food.
  const gf = freshGame(777);
  gf.dispatch('pets/hatchStarter', { archetype: 'wild', name: 'Nib' });
  const fs = gf.getState();
  const fid = fs.pets.active[0];
  const fp = fs.pets.list[fid];
  gf.dispatch('dev/grant', { item: 'berries', qty: 30 });
  gf.dispatch('dev/grant', { item: 'rabbit_roast', qty: 30 });
  gf.dispatch('dev/grant', { item: 'vigor_tonic', qty: 30 });
  gf.dispatch('pets/setPantry', { item: 'vigor_tonic', on: false });
  threw = false;
  try { gf.dispatch('pets/setPantry', { item: 'berries', on: true }); } catch { threw = true; }
  check('raw food is not a pantry item', threw && !pantryList(fs, data).some((e) => e.id === 'berries'));
  gf.dispatch('harvest/assign', { worker: fid, zone: 'meadowfold', skill: 'hunting', node: data.zones.zones[0].harvest.hunting[0].id });
  let ate = 0, restedF = false;
  const eaten = new Set();
  gf.onEvents((evs) => evs.forEach((e) => { if (e.type === 'petAte') { ate++; eaten.add(e.item); } if (e.type === 'petRest') restedF = true; }));
  runChunks(gf, 6 * H, 60000);
  check('with meals the pet never rests in 6 h', !restedF && !fp.resting);
  check('it ate only meals: not raw berries or meat, not the turned-off tonic', ate > 0 && eaten.size === 1 && eaten.has('rabbit_roast')
    && fs.bag.rabbit_roast === 30 - ate && fs.bag.berries === 30 && fs.bag.vigor_tonic === 30 && fs.bag.rabbit_meat > 0, `ate ${ate} ${[...eaten]}`);
  // Raw food alone (even food the pet gathers itself) doesn't stop it resting.
  const gr = freshGame(778);
  gr.dispatch('pets/hatchStarter', { archetype: 'sprout', name: 'Bud' });
  const rs = gr.getState();
  const rid = rs.pets.active[0];
  gr.dispatch('dev/grant', { item: 'berries', qty: 100 });
  gr.dispatch('dev/setLevel', { skill: 'foraging', level: 2 });
  gr.dispatch('harvest/assign', { worker: rid, zone: 'meadowfold', skill: 'foraging', node: 'berry_bush' });
  const rawSum = gr.catchUp(6 * H).pets[rid];
  check('with only raw food the pet still rests', rawSum.restMs > 0.5 * H && !Object.keys(rawSum.ate).length && rs.bag.berries > 100,
    `rested ${(rawSum.restMs / H).toFixed(2)} h, berries ${rs.bag.berries}`);
  check('energy stays near the feed line', fp.energy > 0 && fp.energy <= petMaxEnergy(data, fp));
  threw = false;
  gf.dispatch('dev/petEnergy', { pet: fid, energy: 1e9 });
  try { gf.dispatch('pets/feed', { pet: fid, item: 'berries' }); } catch { threw = true; }
  check('hand-feeding a full pet is refused', threw);
  gf.dispatch('dev/petEnergy', { pet: fid, energy: 10 });
  gf.dispatch('pets/feed', { pet: fid, item: 'berries' });
  check('hand-feeding restores energy', near(fp.energy, 10 + data.items.items.berries.food, 1e-9));
  gf.dispatch('pets/setAutoFeed', { pet: fid, on: false });
  gf.dispatch('dev/petEnergy', { pet: fid, energy: 5 });
  const b0 = fs.bag.rabbit_roast;
  runChunks(gf, 0.5 * H, 60000);
  check('auto-feed off: no eating', fs.bag.rabbit_roast === b0 && fp.resting);

  // 5. Same results for live ticks and offline chunks (no shared food in play).
  const ga = freshGame(4242), gb = freshGame(4242);
  for (const gg of [ga, gb]) {
    gg.dispatch('pets/hatchStarter', { archetype: 'stone', name: 'Rocky' });
    gg.dispatch('harvest/assign', { worker: 'player', zone: 'meadowfold', skill: 'chopping', node: 'pine' });
    gg.dispatch('harvest/assign', { worker: gg.getState().pets.active[0], zone: 'meadowfold', skill: 'mining', node: data.zones.zones[0].harvest.mining[0].id });
  }
  runChunks(ga, 5 * H, 250);
  gb.catchUp(5 * H);
  const sa = ga.getState(), sb = gb.getState();
  const pa = sa.pets.list[sa.pets.active[0]], pb = sb.pets.list[sb.pets.active[0]];
  check('live ticks and catch-up give the same bag', sortedJson(sa.bag) === sortedJson(sb.bag), `${JSON.stringify(sa.bag)} vs ${JSON.stringify(sb.bag)}`);
  check('... and the same pet', pa.level === pb.level && near(pa.xp, pb.xp, 1e-6) && near(pa.energy, pb.energy, 1e-6) && pa.bond === pb.bond, `L${pa.level}/${pb.level} E${pa.energy.toFixed(4)}/${pb.energy.toFixed(4)}`);

  // 6. Daily pat.
  const gp = freshGame();
  gp.dispatch('pets/hatchStarter', { archetype: 'tide', name: 'Drip' });
  const pp = gp.getState().pets.list[gp.getState().pets.active[0]];
  gp.dispatch('pets/pat', { pet: pp.id });
  check('pat gives +10 Bond', pp.bond === data.balance.pets.bond.pat);
  threw = false;
  try { gp.dispatch('pets/pat', { pet: pp.id }); } catch { threw = true; }
  check('second pat the same day is refused', threw && pp.bond === 10);
  clockNow += 24 * H;
  gp.dispatch('pets/pat', { pet: pp.id });
  check('pat works again the next day', pp.bond === 20);

  // 7. Two active pets, swap, stable rest.
  gp.dispatch('dev/addPet', { archetype: 'wild', quality: 'rare' });
  const s7 = gp.getState();
  const second = s7.pets.active[1];
  check('second pet takes slot 2', !!second && !!s7.workers[second]);
  gp.dispatch('dev/addPet', { archetype: 'sprout', quality: 'common' });
  const third = Object.keys(s7.pets.list).find((k) => !s7.pets.active.includes(k));
  check('third pet goes to the Stable', !!third && !s7.workers[third]);
  gp.dispatch('pets/setActive', { pet: third, slot: 1 });
  check('swap moves the old pet to the Stable', s7.pets.active[1] === third && !s7.workers[second] && !!s7.workers[third]);
  gp.dispatch('dev/petEnergy', { pet: second, energy: 0 });
  gp.advance(0.25 * H);
  check('stabled pets rest twice as fast', near(s7.pets.list[second].energy, 50, 1e-6), s7.pets.list[second].energy.toFixed(3));

  // 8. Offline catch-up speed and summary, and a save round trip.
  const go = freshGame(5);
  go.dispatch('pets/hatchStarter', { archetype: 'sprout', name: 'Fast' });
  go.dispatch('dev/addPet', { archetype: 'tide', quality: 'common' });
  const so = go.getState();
  go.dispatch('dev/grant', { item: 'berry_compote', qty: 20 });
  go.dispatch('harvest/assign', { worker: 'player', zone: 'meadowfold', skill: 'chopping', node: 'pine' });
  go.dispatch('harvest/assign', { worker: so.pets.active[0], zone: 'meadowfold', skill: 'chopping', node: 'pine' });
  go.dispatch('harvest/assign', { worker: so.pets.active[1], zone: 'meadowfold', skill: 'mining', node: data.zones.zones[0].harvest.mining[0].id });
  const t0 = performance.now();
  const sum = go.catchUp(16 * H);
  const dt = performance.now() - t0;
  check('16 h catch-up with 3 workers is fast', dt < 300, `${dt.toFixed(0)} ms`);
  const ps = sum.pets[so.pets.active[1]];
  check('summary has pet work, rest and meals', !!ps && ps.workMs > 0 && ps.restMs > 0 && sum.workers[so.pets.active[0]]?.actions > 0, ps ? `work ${(ps.workMs / H).toFixed(1)} h rest ${(ps.restMs / H).toFixed(1)} h` : '');
  check('state still valid', validateState(so) === null, validateState(so) || '');
  const rt = parseSave(JSON.stringify(so));
  check('save round trip', !!rt.state && JSON.stringify(rt.state) === JSON.stringify(so));

  // 9. Crafting (Phase 4): the copper axe chain end to end, queues offline, quality, buffs.
  const v3 = JSON.parse(JSON.stringify(so));
  v3.version = 3; delete v3.crafting; delete v3.buffs; delete v3.stats.crafts;
  const m3 = parseSave(JSON.stringify(v3));
  check('v3 save migrates to v4 and keeps pets', !!m3.state && m3.state.version === 4 && Object.keys(m3.state.pets.list).length === Object.keys(so.pets.list).length, m3.error || '');
  const gc = freshGame(777);
  const sc = gc.getState();
  const refused = (type, payload) => { try { gc.dispatch(type, payload); return false; } catch { return true; } };
  check('no materials: refused', refused('crafting/start', { recipe: 'pine_plank', qty: 1 }));
  gc.dispatch('dev/grant', { item: 'copper_ore', qty: 6 });
  gc.dispatch('dev/grant', { item: 'pine_log', qty: 4 });
  gc.dispatch('crafting/start', { recipe: 'copper_bar', qty: 2 });
  check('materials leave the bag when queued', sc.bag.copper_ore === 2);
  check('queue full at 1 slot', refused('crafting/start', { recipe: 'copper_bar', qty: 1 }) && sc.bag.copper_ore === 2);
  gc.dispatch('crafting/start', { recipe: 'pine_plank', qty: 2 });
  gc.catchUp(H);
  check('queues finish offline', sc.bag.copper_bar === 2 && sc.bag.pine_plank === 2 && sc.crafting.stations.forge.notice, JSON.stringify(sc.bag));
  check('crafting gives skill XP', sc.skills.smithing.xp > 0 && sc.skills.carpentry.xp > 0);
  check('tool head is level-gated', refused('crafting/start', { recipe: 'copper_axe_head', qty: 1 }));
  gc.dispatch('dev/setLevel', { skill: 'smithing', level: 10 });
  gc.dispatch('crafting/start', { recipe: 'copper_axe_head', qty: 1 });
  gc.dispatch('dev/setLevel', { skill: 'carpentry', level: 2 });
  gc.dispatch('crafting/start', { recipe: 'tool_handle', qty: 1 });
  gc.catchUp(H);
  check('axe head and handle made', sc.bag.copper_axe_head === 1 && sc.bag.tool_handle === 1);
  check('copper axe needs Carpentry 10', refused('crafting/start', { recipe: 'copper_axe', qty: 1 }));
  gc.dispatch('dev/setLevel', { skill: 'carpentry', level: 10 });
  gc.dispatch('crafting/start', { recipe: 'copper_axe', qty: 1, focus: 'perfect' });
  gc.catchUp(H);
  check('copper axe crafted and equipped', sc.tools.axe.item === 'copper_axe' && !!sc.bag.stone_axe, JSON.stringify(sc.tools.axe));
  // Cancel returns materials for unmade items.
  gc.dispatch('dev/grant', { item: 'pine_log', qty: 20 });
  gc.dispatch('crafting/start', { recipe: 'pine_plank', qty: 10 });
  gc.advance(4100);
  gc.dispatch('crafting/cancel', { station: 'workbench', index: 0 });
  check('cancel refunds unmade items', sc.bag.pine_log === 18 && sc.bag.pine_plank === 2, `logs ${sc.bag.pine_log} planks ${sc.bag.pine_plank}`);
  // Quality odds rise with level and Focus.
  const meal = data.recipes.recipes.find((r) => r.id === 'berry_compote');
  gc.dispatch('dev/setLevel', { skill: 'cooking', level: 30 });
  const o0 = qualityOdds(sc, data, meal, null);
  const o2 = qualityOdds(sc, data, meal, 'perfect');
  check('quality odds follow level and caps', near(o0.fine, 0.39, 1e-9) && near(o0.masterwork, 0.165, 1e-9), JSON.stringify(o0));
  check('Perfect focus raises odds (capped)', near(o2.masterwork, 0.4125, 1e-9) && o2.fine <= 0.8 && o2.fine + o2.masterwork <= 1, JSON.stringify(o2));
  gc.dispatch('dev/grant', { item: 'berries', qty: 300 });
  gc.dispatch('crafting/start', { recipe: 'berry_compote', qty: 100, focus: 'perfect' });
  gc.catchUp(2 * H);
  const fine = sc.bag['berry_compote:fine'] || 0;
  const mw = sc.bag['berry_compote:masterwork'] || 0;
  check('meals roll quality', fine > 15 && mw > 20 && (sc.bag.berry_compote || 0) + fine + mw === 100, `normal ${sc.bag.berry_compote} fine ${fine} mw ${mw}`);
  // Buffs: the player eats a meal; it speeds up harvesting and wears off after its time.
  gc.dispatch('harvest/assign', { worker: 'player', zone: 'meadowfold', skill: 'foraging', node: 'herb_patch' });
  const task = sc.workers.player.task;
  const before = actionMs(sc, data, 'player', task);
  gc.dispatch('buffs/use', { item: 'berry_compote:masterwork' });
  const during = actionMs(sc, data, 'player', task);
  check('a meal buff speeds up the player', near(before / during, 1 + 0.08 * 1.5, 1e-9), `${before} / ${during}`);
  gc.catchUp(61 * 60000);
  check('the buff wears off after an hour', !sc.buffs.berry_compote && near(actionMs(sc, data, 'player', task), before, 1e-9));
  // Pets eat meals; a favorite dish adds Bond.
  gc.dispatch('pets/hatchStarter', { archetype: 'sprout', name: 'Crafty' });
  const cp = sc.pets.list[sc.pets.active[0]];
  cp.energy = 10;
  const bond0 = cp.bond;
  gc.dispatch('pets/feed', { pet: cp.id, item: 'berry_compote:fine' });
  check('fine meal restores more and favorite dish adds Bond', near(cp.energy, 10 + 25 * 1.25, 1e-9) && cp.bond === bond0 + data.balance.pets.bond.favoriteDish, `E ${cp.energy} bond ${cp.bond}`);

  // Live ticks and catch-up agree with a buff ending and a tool finishing mid-span.
  const twin = (fn) => {
    const a = freshGame(4242);
    fn(a);
    return a;
  };
  const setup = (gx) => {
    gx.dispatch('pets/hatchStarter', { archetype: 'wild', name: 'Twin' });
    gx.dispatch('dev/setLevel', { skill: 'smithing', level: 10 });
    gx.dispatch('dev/setLevel', { skill: 'carpentry', level: 10 });
    gx.dispatch('dev/grant', { item: 'copper_axe_head', qty: 1 });
    gx.dispatch('dev/grant', { item: 'tool_handle', qty: 1 });
    gx.dispatch('dev/grant', { item: 'meadow_draught', qty: 1 });
    gx.dispatch('dev/grant', { item: 'pine_log', qty: 60 });
    gx.dispatch('harvest/assign', { worker: 'player', zone: 'meadowfold', skill: 'chopping', node: 'pine' });
    gx.dispatch('harvest/assign', { worker: gx.getState().pets.active[0], zone: 'meadowfold', skill: 'chopping', node: 'pine' });
    gx.dispatch('buffs/use', { item: 'meadow_draught' });
    gx.dispatch('crafting/start', { recipe: 'copper_axe', qty: 1 });
    gx.dispatch('crafting/start', { recipe: 'pine_plank', qty: 30 });
  };
  const cLive = twin(setup);
  runChunks(cLive, 3 * H, 250);
  const cOff = twin(setup);
  cOff.catchUp(3 * H);
  const ls = cLive.getState();
  const os = cOff.getState();
  check('crafting: live ticks and catch-up give the same bag', sortedJson(ls.bag) === sortedJson(os.bag), `${sortedJson(ls.bag)} vs ${sortedJson(os.bag)}`);
  check('... the same skills', JSON.stringify(ls.skills) === JSON.stringify(os.skills));
  check('crafted state still valid', validateState(os) === null && validateState(sc) === null, validateState(os) || validateState(sc) || '');

  // 10. Buildings (Phase 5).
  const gB = freshGame(77);
  const sB = gB.getState();
  check('every building has an entry; stations start at tier 1, Garden and Nest at 0',
    data.buildings.buildings.every((b) => sB.buildings[b.id]?.tier === b.startTier) && sB.buildings.forge.tier === 1 && sB.buildings.garden.tier === 0);
  const refusedB = (type, payload) => { try { gB.dispatch(type, payload); return false; } catch { return true; } };
  check('stable tier 2 is refused while the Cottage is tier 1', refusedB('buildings/upgrade', { building: 'stable' }));
  check('cottage upgrade without materials is refused', refusedB('buildings/upgrade', { building: 'cottage' }) && sB.buildings.cottage.tier === 1);
  const c2 = tierCost(data, 'cottage', 2);
  for (const [item, n] of Object.entries(c2.items)) gB.dispatch('dev/grant', { item, qty: n });
  check('upgradeCheck says yes once the materials are in the bag', upgradeCheck(sB, data, 'cottage').ok && canUpgradeAny(sB, data));
  gB.dispatch('buildings/upgrade', { building: 'cottage' });
  check('cottage reaches tier 2 and the materials are spent',
    sB.buildings.cottage.tier === 2 && Object.keys(c2.items).every((i) => !sB.bag[i]));
  check('upgrade gives Renown XP (30 x tier)', sB.renown.xp === data.balance.buildings.renownXpPerTier * 2);
  check('offline cap grows to 10 h', offlineCapMs(sB, data.balance) === 10 * H);
  check('garden stays locked at Renown 1', /Renown/.test(upgradeCheck(sB, data, 'garden').reason || ''));
  const w2 = tierCost(data, 'workbench', 2);
  for (const [item, n] of Object.entries(w2.items)) gB.dispatch('dev/grant', { item, qty: n });
  gB.dispatch('buildings/upgrade', { building: 'workbench' });
  check('workbench tier 2 crafts 5% faster',
    near(itemMs(sB, data, data.recipes.recipes.find((r) => r.id === 'pine_plank')), 4000 / 1.05, 1e-6));
  gB.dispatch('dev/setBuilding', { building: 'cottage', tier: 3 });
  for (const [item, n] of Object.entries(tierCost(data, 'workbench', 3).items)) gB.dispatch('dev/grant', { item, qty: n });
  gB.dispatch('dev/addCoins', { amount: 100000 });
  const bp = upgradeCheck(sB, data, 'workbench');
  check('tier 3 needs a blueprint', !bp.ok && bp.needsBlueprint);
  gB.dispatch('dev/grant', { item: tierCost(data, 'workbench', 3).blueprint, qty: 1 });
  const coins0 = sB.coins;
  gB.dispatch('buildings/upgrade', { building: 'workbench' });
  check('tier 3 spends the blueprint and coins; 2 queue slots',
    sB.buildings.workbench.tier === 3 && !sB.bag[tierCost(data, 'workbench', 3).blueprint]
    && sB.coins === coins0 - tierCost(data, 'workbench', 3).coins && queueSlots(sB, data, 'workbench') === 2);
  gB.dispatch('pets/hatchStarter', { archetype: 'sprout', name: 'A' });
  const capacity = petCapacity(sB, data);
  while (Object.keys(sB.pets.list).length < capacity) gB.dispatch('dev/addPet', { archetype: 'wild' });
  check('a full Stable refuses another pet', capacity === 4 && refusedB('dev/addPet', { archetype: 'wild' }));
  gB.dispatch('dev/setBuilding', { building: 'stable', tier: 2 });
  check('Stable tier 2 has room for 2 more', petCapacity(sB, data) === 6 && !refusedB('dev/addPet', { archetype: 'wild' }));
  check('Stable tier 2 rests 20% faster', near(petRestPerHour(sB, data, sB.pets.list.pet1), 120, 1e-9));
  check('state with buildings is valid', validateState(sB) === null, validateState(sB) || '');
} catch (err) {
  failed++;
  lines.push(`FAIL  crashed: ${err.stack || err}`);
}
lines.push('', failed ? `${failed} FAILED` : 'ALL PASSED');
out.innerHTML = lines.map((l) => `<span class="${l.startsWith('FAIL') || l.includes('FAILED') ? 'fail' : 'pass'}">${l.replace(/</g, '&lt;')}</span>`).join('\n');
window.__testResult = { failed, lines };
</script>
