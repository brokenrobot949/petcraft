<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetCraft core tests</title>
<style>body{font:14px/1.4 system-ui,sans-serif;margin:16px;background:#fff;color:#111}.pass{color:#176b2c}.fail{color:#b00020;font-weight:bold}pre{white-space:pre-wrap}</style>
</head>
<body>
<h1>PetCraft core tests (dev only)</h1>
<pre id="out">running...</pre>
<script type="module">
// Dev-only checks of the simulation core: pets, energy, feeding, Bond, saves.
// Open http://localhost:<port>/tools/tests/core.html. Not shipped.
import { loadData } from '../../js/core/data.js';
import { createInitialState, validateState, newTamingState, SCHEMA_VERSION } from '../../js/core/state.js';
import { createGame, registerCommands } from '../../js/core/game.js';
import { commands as devCommands } from '../dev/dev.js';
import { parseSave } from '../../js/core/save.js';
import { petMaxEnergy, petDrainPerHour } from '../../js/systems/petstats.js';
import { qualityOdds, itemMs, queueSlots } from '../../js/systems/crafting.js';
import { tierCost, upgradeCheck, canUpgradeAny, petCapacity } from '../../js/systems/buildings.js';
import { petRestPerHour } from '../../js/systems/petstats.js';
import { offlineCapMs } from '../../js/core/time.js';
import { pantryList, foodList, foodValue } from '../../js/systems/pets.js';
import { actionMs, zoneUnlocked } from '../../js/systems/harvest.js';
import { xpToNext } from '../../js/systems/skills.js';
import { recipeCheck } from '../../js/systems/crafting.js';
import { rankInfo, xpToNextRank } from '../../js/systems/renown.js';
import { weekOf, sellPrice } from '../../js/systems/village.js';
import { growMs, seedDef } from '../../js/systems/garden.js';
import { achievementList, wornTitle } from '../../js/systems/achievements.js';
import { localDay } from '../../js/core/time.js';
import { catchChance, freePetSpaces, encounterInfo, tamingNotice, rollQuality } from '../../js/systems/taming.js';
import { digMs, mapItemFor } from '../../js/systems/treasure.js';
import { eggSlots, hatchMs, nestNotice } from '../../js/systems/nest.js';
import { EFFECT_KINDS, effectText, petSpeed, petSpecies, branchDef, effectValue } from '../../js/systems/petstats.js';
import { bestiaryList, bestiaryStars } from '../../js/systems/bestiary.js';
import { talentInfo, evolveInfo, assistInfo, petNotice, talentPicksDue, isFavoriteDish } from '../../js/systems/pets.js';
import { stationList } from '../../js/systems/crafting.js';
import { revealChance } from '../../js/systems/taming.js';
import { gardenBonus } from '../../js/systems/garden.js';
import { currentStage, pendingScene, sanctuaryBonus, ended, projectList } from '../../js/systems/sanctuary.js';
import { storyList, storyNotice, sceneFor } from '../../js/systems/story.js';
import { groveOpen, retireInfo, legacyValue, legacyLines } from '../../js/systems/elders.js';
import { masteryStars, masteryProgress } from '../../js/systems/skills.js';
import { trapOptions } from '../../js/systems/taming.js';
import { petStage, petRole, talentDef } from '../../js/systems/petstats.js';

registerCommands(devCommands); // test mode commands are dev-only (tools/dev)
const out = document.getElementById('out');
const lines = [];
let failed = 0;
const H = 3600000;
function check(name, ok, detail = '') {
  if (!ok) failed++;
  lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? `  (${detail})` : ''}`);
}
const sortedJson = (o) => JSON.stringify(Object.keys(o).sort().map((k) => [k, o[k]]));
const near = (a, b, tol) => Math.abs(a - b) <= tol;
// A pet without its dates (bornAt, scrapbook times): the test clock stands still, so live ticks and catch-up
// date things differently. Dates are for display only.
const undated = (p) => p && { ...p, bornAt: 0, book: p.book.map((e) => ({ ...e, t: null })) };

// The data files are fetched relative to the page, so load them from the repo root.
const base = new URL('../../', location.href);
const realFetch = window.fetch.bind(window);
window.fetch = (u, o) => realFetch(typeof u === 'string' && u.startsWith('data/') ? new URL(u, base) : u, o);
const data = await loadData();

let clockNow = Date.UTC(2026, 9, 19, 12);
const clock = () => clockNow;

// stations: build the Forge and Alchemy Lab (a new game starts without them since Phase 6).
function freshGame(seed = 12345, { stations = true } = {}) {
  const s = createInitialState(clockNow);
  s.rng = seed;
  s.workers.player.rng = seed + 1;
  Object.assign(s, newTamingState(seed));
  if (stations) Object.assign(s.buildings, { forge: { tier: 1 }, alchemyLab: { tier: 1 } });
  return createGame(data, JSON.parse(JSON.stringify(s)), { clock });
}

function runChunks(game, ms, stepMs) {
  let left = ms;
  while (left > 0) { const t = Math.min(stepMs, left); game.advance(t); left -= t; }
}

try {
  // 1. Migration from a Phase 2 (v2) save.
  const v2 = {
    version: 2, meta: { createdAt: 1, lastSavedAt: 1, launches: 3 }, rng: 99, settings: { music: true, sound: true },
    coins: 0, renown: { rank: 1, xp: 0 }, buildings: { cottage: { tier: 1 } }, skills: { chopping: { level: 4, xp: 10 } },
    bag: { pine_log: 40 }, tools: { axe: { item: 'stone_axe', quality: 'normal' } },
    workers: { player: { task: { zone: 'meadowfold', skill: 'chopping', node: 'pine' }, progressMs: 100 } }, stats: { actions: { chopping: 50 } },
  };
  const mig = parseSave(JSON.stringify(v2));
  check('v2 save migrates to the current version and validates', !!mig.state && mig.state.version === SCHEMA_VERSION, mig.error || '');
  check('migration keeps progress', mig.state?.bag.pine_log === 40 && mig.state?.skills.chopping.level === 4 && mig.state?.workers.player.task?.node === 'pine');
  const g0 = createGame(data, mig.state, { clock });
  check('migrated save needs a starter egg', g0.getState().pets.active.length === 2 && !g0.getState().pets.starter);

  // 2. Hatch the starter.
  const g = freshGame();
  let threw = false;
  try { g.dispatch('pets/hatchStarter', { archetype: 'sprout', name: '   ' }); } catch { threw = true; }
  check('a blank name is refused', threw);
  g.dispatch('pets/hatchStarter', { archetype: 'sprout', name: '  Mossy  <b>  ' });
  const st = g.getState();
  const pid = st.pets.active[0];
  const pet = st.pets.list[pid];
  check('starter hatches Uncommon into slot 1 with a worker', pet && pet.quality === 'uncommon' && !!st.workers[pid] && st.pets.active[1] === null);
  check('name is cleaned', pet.name === 'Mossy b', JSON.stringify(pet.name));
  threw = false;
  try { g.dispatch('pets/hatchStarter', { archetype: 'stone', name: 'Two' }); } catch { threw = true; }
  check('only one starter', threw);

  // 3. A full bar lasts about 3 hours of work, then the pet rests until full.
  g.dispatch('harvest/assign', { worker: pid, zone: 'meadowfold', skill: 'chopping', node: 'pine' });
  const drain = petDrainPerHour(data, pet);
  const fullHours = petMaxEnergy(data, pet) / drain;
  check('full bar = about 3 h of work', near(fullHours, 3, 0.2), `${fullHours.toFixed(2)} h`);
  // No food in the bag: work until 0.
  const logs0 = st.bag.pine_log || 0;
  let worked = 0, rested = 0, wentToRest = false, woke = false, shareXp = 0, petBaseXp = 0;
  const off = g.onEvents((evs) => {
    for (const e of evs) {
      if (e.type === 'harvest' && e.worker === pid) { shareXp += e.xp; petBaseXp += e.petXp; }
      if (e.type === 'petTime' && e.pet === pid) { worked += e.workMs; rested += e.restMs; }
      if (e.type === 'petRest') wentToRest = true;
      if (e.type === 'petWoke') woke = true;
    }
  });
  runChunks(g, 3.2 * H, 60000);
  check('pet goes to rest at 0 energy', wentToRest && pet.resting, `energy ${pet.energy.toFixed(2)}`);
  check('worked about 3 h before resting', near(worked / H, fullHours, 0.15), `${(worked / H).toFixed(3)} h`);
  check('pet harvested logs', (st.bag.pine_log || 0) > logs0, `${(st.bag.pine_log || 0) - logs0} logs`);
  check('pet gained XP / levels', pet.level > 1 || pet.xp > 0, `level ${pet.level}`);
  let playerXp = st.skills.chopping.xp;
  for (let l = 1; l < st.skills.chopping.level; l++) playerXp += xpToNext(l, data.balance);
  const share = data.balance.pets.playerXpShare;
  check('pet work gives the player its share of skill XP', shareXp > 0 && near(playerXp, shareXp, 1e-6 * shareXp) && near(shareXp, petBaseXp * share / data.balance.pets.xpPerSkillXp, 1e-6 * shareXp),
    `${playerXp.toFixed(1)} player XP, share ${share}`);
  check('work earns Bond (+1 per 30 min)', pet.bond === 6, `bond ${pet.bond}`);
  runChunks(g, 1.2 * H, 60000);
  check('rests about 1 h, wakes full, works again', woke && !pet.resting, `rested ${(rested / H).toFixed(2)} h`);
  check('rest took about 1 h', near(rested / H, petMaxEnergy(data, pet) / 100, 0.02));
  off();

  // 4. Auto-feed from the pantry: cooked meals and tonics only, never raw food.
  const gf = freshGame(777);
  gf.dispatch('pets/hatchStarter', { archetype: 'wild', name: 'Nib' });
  const fs = gf.getState();
  const fid = fs.pets.active[0];
  const fp = fs.pets.list[fid];
  gf.dispatch('dev/grant', { item: 'berries', qty: 30 });
  gf.dispatch('dev/grant', { item: 'rabbit_roast', qty: 30 });
  gf.dispatch('dev/grant', { item: 'vigor_tonic', qty: 30 });
  gf.dispatch('pets/setPantry', { item: 'vigor_tonic', on: false });
  threw = false;
  try { gf.dispatch('pets/setPantry', { item: 'berries', on: true }); } catch { threw = true; }
  check('raw food is not a pantry item', threw && !pantryList(fs, data).some((e) => e.id === 'berries'));
  gf.dispatch('harvest/assign', { worker: fid, zone: 'meadowfold', skill: 'hunting', node: data.zones.zones[0].harvest.hunting[0].id });
  let ate = 0, restedF = false;
  const eaten = new Set();
  gf.onEvents((evs) => evs.forEach((e) => { if (e.type === 'petAte') { ate++; eaten.add(e.item); } if (e.type === 'petRest') restedF = true; }));
  runChunks(gf, 6 * H, 60000);
  check('with meals the pet never rests in 6 h', !restedF && !fp.resting);
  check('it ate only meals: not raw berries or meat, not the turned-off tonic', ate > 0 && eaten.size === 1 && eaten.has('rabbit_roast')
    && fs.bag.rabbit_roast === 30 - ate && fs.bag.berries === 30 && fs.bag.vigor_tonic === 30 && fs.bag.rabbit_meat > 0, `ate ${ate} ${[...eaten]}`);
  // Raw food alone (even food the pet gathers itself) doesn't stop it resting.
  const gr = freshGame(778);
  gr.dispatch('pets/hatchStarter', { archetype: 'sprout', name: 'Bud' });
  const rs = gr.getState();
  const rid = rs.pets.active[0];
  gr.dispatch('dev/grant', { item: 'berries', qty: 100 });
  gr.dispatch('dev/setLevel', { skill: 'foraging', level: 2 });
  gr.dispatch('harvest/assign', { worker: rid, zone: 'meadowfold', skill: 'foraging', node: 'berry_bush' });
  const rawSum = gr.catchUp(6 * H).pets[rid];
  check('with only raw food the pet still rests', rawSum.restMs > 0.5 * H && !Object.keys(rawSum.ate).length && rs.bag.berries > 100,
    `rested ${(rawSum.restMs / H).toFixed(2)} h, berries ${rs.bag.berries}`);
  check('energy stays near the feed line', fp.energy > 0 && fp.energy <= petMaxEnergy(data, fp));
  threw = false;
  gf.dispatch('dev/petEnergy', { pet: fid, energy: 1e9 });
  try { gf.dispatch('pets/feed', { pet: fid, item: 'rabbit_roast' }); } catch { threw = true; }
  check('hand-feeding a full pet is refused', threw);
  gf.dispatch('dev/petEnergy', { pet: fid, energy: 10 });
  threw = false;
  try { gf.dispatch('pets/feed', { pet: fid, item: 'berries' }); } catch { threw = true; }
  check('hand-feeding raw food is refused', threw && fp.energy === 10 && !foodList(fs, data).some((e) => e.id === 'berries'));
  gf.dispatch('pets/feed', { pet: fid, item: 'rabbit_roast' });
  check('hand-feeding restores energy', near(fp.energy, 10 + foodValue(data, 'rabbit_roast'), 1e-9));
  {
    const kitchen = new Set(data.recipes.recipes.filter((r) => r.station === 'kitchen').map((r) => r.output));
    const pets = Array.from({ length: 40 }, (_, i) => { const g = freshGame(9000 + i); g.dispatch('pets/hatchStarter', { archetype: 'wild', name: 'F' }); return Object.values(g.getState().pets.list)[0]; });
    check('every favorite dish is a cooked Kitchen meal', pets.every((p) => p.favorite && data.items.items[p.favorite].category === 'meal' && kitchen.has(p.favorite)));
  }
  gf.dispatch('pets/setAutoFeed', { pet: fid, on: false });
  gf.dispatch('dev/petEnergy', { pet: fid, energy: 5 });
  const b0 = fs.bag.rabbit_roast;
  runChunks(gf, 0.5 * H, 60000);
  check('auto-feed off: no eating', fs.bag.rabbit_roast === b0 && fp.resting);

  // 5. Same results for live ticks and offline chunks (no shared food in play).
  const ga = freshGame(4242), gb = freshGame(4242);
  for (const gg of [ga, gb]) {
    gg.dispatch('pets/hatchStarter', { archetype: 'stone', name: 'Rocky' });
    gg.dispatch('harvest/assign', { worker: 'player', zone: 'meadowfold', skill: 'chopping', node: 'pine' });
    gg.dispatch('harvest/assign', { worker: gg.getState().pets.active[0], zone: 'meadowfold', skill: 'mining', node: data.zones.zones[0].harvest.mining[0].id });
  }
  runChunks(ga, 5 * H, 250);
  gb.catchUp(5 * H);
  const sa = ga.getState(), sb = gb.getState();
  const pa = sa.pets.list[sa.pets.active[0]], pb = sb.pets.list[sb.pets.active[0]];
  check('live ticks and catch-up give the same bag', sortedJson(sa.bag) === sortedJson(sb.bag), `${JSON.stringify(sa.bag)} vs ${JSON.stringify(sb.bag)}`);
  check('... and the same pet', pa.level === pb.level && near(pa.xp, pb.xp, 1e-6) && near(pa.energy, pb.energy, 1e-6) && pa.bond === pb.bond, `L${pa.level}/${pb.level} E${pa.energy.toFixed(4)}/${pb.energy.toFixed(4)}`);

  // 6. Daily pat.
  const gp = freshGame();
  gp.dispatch('pets/hatchStarter', { archetype: 'tide', name: 'Drip' });
  const pp = gp.getState().pets.list[gp.getState().pets.active[0]];
  gp.dispatch('pets/pat', { pet: pp.id });
  check('pat gives +10 Bond', pp.bond === data.balance.pets.bond.pat);
  threw = false;
  try { gp.dispatch('pets/pat', { pet: pp.id }); } catch { threw = true; }
  check('second pat the same day is refused', threw && pp.bond === 10);
  clockNow += 24 * H;
  gp.dispatch('pets/pat', { pet: pp.id });
  check('pat works again the next day', pp.bond === 20);

  // 7. Two active pets, swap, stable rest.
  gp.dispatch('dev/addPet', { archetype: 'wild', quality: 'rare' });
  const s7 = gp.getState();
  const second = s7.pets.active[1];
  check('second pet takes slot 2', !!second && !!s7.workers[second]);
  gp.dispatch('dev/addPet', { archetype: 'sprout', quality: 'common' });
  const third = Object.keys(s7.pets.list).find((k) => !s7.pets.active.includes(k));
  check('third pet goes to the Stable', !!third && !s7.workers[third]);
  gp.dispatch('pets/setActive', { pet: third, slot: 1 });
  check('swap moves the old pet to the Stable', s7.pets.active[1] === third && !s7.workers[second] && !!s7.workers[third]);
  gp.dispatch('dev/petEnergy', { pet: second, energy: 0 });
  gp.advance(0.25 * H);
  check('stabled pets rest twice as fast', near(s7.pets.list[second].energy, 50, 1e-6), s7.pets.list[second].energy.toFixed(3));

  // 8. Offline catch-up speed and summary, and a save round trip.
  const go = freshGame(5);
  go.dispatch('pets/hatchStarter', { archetype: 'sprout', name: 'Fast' });
  go.dispatch('dev/addPet', { archetype: 'tide', quality: 'common' });
  const so = go.getState();
  go.dispatch('dev/grant', { item: 'berry_compote', qty: 20 });
  go.dispatch('harvest/assign', { worker: 'player', zone: 'meadowfold', skill: 'chopping', node: 'pine' });
  go.dispatch('harvest/assign', { worker: so.pets.active[0], zone: 'meadowfold', skill: 'chopping', node: 'pine' });
  go.dispatch('harvest/assign', { worker: so.pets.active[1], zone: 'meadowfold', skill: 'mining', node: data.zones.zones[0].harvest.mining[0].id });
  const t0 = performance.now();
  const sum = go.catchUp(16 * H);
  const dt = performance.now() - t0;
  check('16 h catch-up with 3 workers is fast', dt < 300, `${dt.toFixed(0)} ms`);
  const ps = sum.pets[so.pets.active[1]];
  check('summary has pet work, rest and meals', !!ps && ps.workMs > 0 && ps.restMs > 0 && sum.workers[so.pets.active[0]]?.actions > 0, ps ? `work ${(ps.workMs / H).toFixed(1)} h rest ${(ps.restMs / H).toFixed(1)} h` : '');
  check('state still valid', validateState(so) === null, validateState(so) || '');
  const rt = parseSave(JSON.stringify(so));
  check('save round trip', !!rt.state && JSON.stringify(rt.state) === JSON.stringify(so));

  // 9. Crafting (Phase 4): the copper axe chain end to end, queues offline, quality, buffs.
  const v3 = JSON.parse(JSON.stringify(so));
  v3.version = 3; delete v3.crafting; delete v3.buffs; delete v3.stats.crafts;
  const m3 = parseSave(JSON.stringify(v3));
  check('v3 save migrates to the current version and keeps pets', !!m3.state && m3.state.version === SCHEMA_VERSION && Object.keys(m3.state.pets.list).length === Object.keys(so.pets.list).length, m3.error || '');
  const gc = freshGame(777);
  const sc = gc.getState();
  const refused = (type, payload) => { try { gc.dispatch(type, payload); return false; } catch { return true; } };
  check('no materials: refused', refused('crafting/start', { recipe: 'pine_plank', qty: 1 }));
  gc.dispatch('dev/grant', { item: 'copper_ore', qty: 6 });
  gc.dispatch('dev/grant', { item: 'pine_log', qty: 4 });
  gc.dispatch('crafting/start', { recipe: 'copper_bar', qty: 2 });
  check('materials leave the bag when queued', sc.bag.copper_ore === 2);
  check('queue full at 1 slot', refused('crafting/start', { recipe: 'copper_bar', qty: 1 }) && sc.bag.copper_ore === 2);
  gc.dispatch('crafting/start', { recipe: 'pine_plank', qty: 2 });
  gc.catchUp(H);
  check('queues finish offline', sc.bag.copper_bar === 2 && sc.bag.pine_plank === 2 && sc.crafting.stations.forge.notice, JSON.stringify(sc.bag));
  check('crafting gives skill XP', sc.skills.smithing.xp > 0 && sc.skills.carpentry.xp > 0);
  check('tool head is level-gated', refused('crafting/start', { recipe: 'copper_axe_head', qty: 1 }));
  gc.dispatch('dev/setLevel', { skill: 'smithing', level: 10 });
  gc.dispatch('crafting/start', { recipe: 'copper_axe_head', qty: 1 });
  gc.dispatch('dev/setLevel', { skill: 'carpentry', level: 2 });
  gc.dispatch('crafting/start', { recipe: 'tool_handle', qty: 1 });
  gc.catchUp(H);
  check('axe head and handle made', sc.bag.copper_axe_head === 1 && sc.bag.tool_handle === 1);
  check('copper axe needs Carpentry 10', refused('crafting/start', { recipe: 'copper_axe', qty: 1 }));
  gc.dispatch('dev/setLevel', { skill: 'carpentry', level: 10 });
  gc.dispatch('crafting/start', { recipe: 'copper_axe', qty: 1, focus: 'perfect' });
  gc.catchUp(H);
  check('copper axe crafted and equipped', sc.tools.axe.item === 'copper_axe' && !!sc.bag.stone_axe, JSON.stringify(sc.tools.axe));
  // Cancel returns materials for unmade items.
  gc.dispatch('dev/grant', { item: 'pine_log', qty: 20 });
  gc.dispatch('crafting/start', { recipe: 'pine_plank', qty: 10 });
  gc.advance(4100);
  gc.dispatch('crafting/cancel', { station: 'workbench', index: 0 });
  check('cancel refunds unmade items', sc.bag.pine_log === 18 && sc.bag.pine_plank === 2, `logs ${sc.bag.pine_log} planks ${sc.bag.pine_plank}`);
  // Quality odds rise with level and Focus.
  const meal = data.recipes.recipes.find((r) => r.id === 'berry_compote');
  gc.dispatch('dev/setLevel', { skill: 'cooking', level: 30 });
  const o0 = qualityOdds(sc, data, meal, null);
  const o2 = qualityOdds(sc, data, meal, 'perfect');
  check('quality odds follow level and caps', near(o0.fine, 0.39, 1e-9) && near(o0.masterwork, 0.165, 1e-9), JSON.stringify(o0));
  check('Perfect focus raises odds (capped)', near(o2.masterwork, 0.4125, 1e-9) && o2.fine <= 0.8 && o2.fine + o2.masterwork <= 1, JSON.stringify(o2));
  gc.dispatch('dev/grant', { item: 'berries', qty: 300 });
  gc.dispatch('crafting/start', { recipe: 'berry_compote', qty: 100, focus: 'perfect' });
  gc.catchUp(2 * H);
  const fine = sc.bag['berry_compote:fine'] || 0;
  const mw = sc.bag['berry_compote:masterwork'] || 0;
  check('meals roll quality', fine > 15 && mw > 20 && (sc.bag.berry_compote || 0) + fine + mw === 100, `normal ${sc.bag.berry_compote} fine ${fine} mw ${mw}`);
  // Buffs: the player eats a meal; it speeds up harvesting and wears off after its time.
  gc.dispatch('harvest/assign', { worker: 'player', zone: 'meadowfold', skill: 'foraging', node: 'herb_patch' });
  const task = sc.workers.player.task;
  const before = actionMs(sc, data, 'player', task);
  gc.dispatch('buffs/use', { item: 'berry_compote:masterwork' });
  const during = actionMs(sc, data, 'player', task);
  check('a meal buff speeds up the player', near(before / during, 1 + 0.08 * 1.5, 1e-9), `${before} / ${during}`);
  gc.catchUp(61 * 60000);
  check('the buff wears off after an hour', !sc.buffs.berry_compote && near(actionMs(sc, data, 'player', task), before, 1e-9));
  // Pets eat meals; a favorite dish adds Bond.
  gc.dispatch('pets/hatchStarter', { archetype: 'sprout', name: 'Crafty' });
  const cp = sc.pets.list[sc.pets.active[0]];
  cp.energy = 10;
  const bond0 = cp.bond;
  gc.dispatch('pets/feed', { pet: cp.id, item: 'berry_compote:fine' });
  check('fine meal restores more and favorite dish adds Bond', near(cp.energy, 10 + 25 * 1.25, 1e-9) && cp.bond === bond0 + data.balance.pets.bond.favoriteDish, `E ${cp.energy} bond ${cp.bond}`);

  // Live ticks and catch-up agree with a buff ending and a tool finishing mid-span.
  const twin = (fn) => {
    const a = freshGame(4242);
    fn(a);
    return a;
  };
  const setup = (gx) => {
    gx.dispatch('pets/hatchStarter', { archetype: 'wild', name: 'Twin' });
    gx.dispatch('dev/setLevel', { skill: 'smithing', level: 10 });
    gx.dispatch('dev/setLevel', { skill: 'carpentry', level: 10 });
    gx.dispatch('dev/grant', { item: 'copper_axe_head', qty: 1 });
    gx.dispatch('dev/grant', { item: 'tool_handle', qty: 1 });
    gx.dispatch('dev/grant', { item: 'meadow_draught', qty: 1 });
    gx.dispatch('dev/grant', { item: 'pine_log', qty: 60 });

  check('endgame: live play and offline catch-up give the same results', sortedJson(gLive.getState().bag) === sortedJson(gOff.getState().bag)
    && JSON.stringify(gLive.getState().skills) === JSON.stringify(gOff.getState().skills));
  check('Phase 9 state is valid', [s7, sP, sM, sE9, sY, sR].every((x) => validateState(x) === null), [s7, sP, sM, sE9, sY, sR].map(validateState).filter(Boolean).join(', '));
  }

  // ---- Phase 11: pet life (play, naps, moods, the scrapbook) ----
  {
  const lifeGame = (seed = 1101) => {
    const gx = freshGame(seed);
    gx.dispatch('pets/hatchStarter', { archetype: 'wild', name: 'Pip' });
    return gx;
  };
  // Migration from v9: life fields, an empty yard, and a scrapbook filled from what the save knows.
  const g9 = lifeGame();
  const p9id = g9.getState().pets.active[0];
  g9.dispatch('dev/petBond', { pet: p9id, bond: 130 }); // 2 hearts
  const v9 = JSON.parse(JSON.stringify(g9.getState()));
  v9.version = 9;
  delete v9.yard;
  for (const p of Object.values(v9.pets.list)) for (const k of ['playDay', 'nap', 'napDay', 'mood', 'book', 'wish', 'trip', 'tricks']) delete p[k];
  const m9 = parseSave(JSON.stringify(v9));
  check('v9 save migrates to v10 and validates', !!m9.state && m9.state.version === SCHEMA_VERSION && SCHEMA_VERSION >= 10, m9.error || '');
  const s9 = m9.state && createGame(data, m9.state, { clock }).getState();
  const b9 = s9?.pets.list[p9id].book || [];
  check('old pets get a scrapbook from what the save knows', b9[0]?.k === 'home' && b9[0].how === 'starter' && b9.filter((e) => e.k === 'heart').length === 2 && !('bookFill' in s9.pets.list[p9id]) && Array.isArray(s9.yard.toys),
    JSON.stringify(b9));

  // Play: once a day, Bond by result, a playful mood that speeds work and runs out in game time.
  const gp = lifeGame();
  const pp = gp.getState().pets.active[0];
  const petP = () => gp.getState().pets.list[pp];
  check('a new pet\'s scrapbook starts with how it came home', petP().book.length === 1 && petP().book[0].k === 'home' && petP().book[0].how === 'starter' && petP().book[0].t === Math.round(clockNow));
  const speed0 = petSpeed(data, petP(), 'hunting');
  const bond0 = petP().bond;
  gp.dispatch('pets/play', { pet: pp, result: 'good' });
  check('playing gives Bond by result and a playful mood', near(petP().bond - bond0, data.balance.petLife.play.bond.good, 1e-9) && petP().mood?.kind === 'playful' && gp.getState().stats.plays === 1);
  check('the playful mood speeds work', near(petSpeed(data, petP(), 'hunting') / speed0, 1 + data.balance.petLife.moods.playful.speed, 1e-9));
  threw = false;
  try { gp.dispatch('pets/play', { pet: pp, result: 'perfect' }); } catch { threw = true; }
  check('only one game a day', threw);
  threw = false;
  try { gp.dispatch('pets/play', { pet: pp, result: 'amazing' }); } catch { threw = true; }
  check('an unknown game result is refused', threw);
  check('Playtime! achievement', !!gp.getState().achievements.done.playtime);
  clockNow += 24 * H;
  gp.dispatch('pets/play', { pet: pp, result: 'perfect' });
  check('a perfect game goes in the scrapbook once', petP().book.filter((e) => e.k === 'play').length === 1 && gp.getState().stats.perfectPlays === 1);
  clockNow -= 24 * H;

  // Mood running out mid-span: live ticks and catch-up agree.
  const moodTwin = () => {
    const gx = lifeGame(1102);
    const id = gx.getState().pets.active[0];
    gx.dispatch('harvest/assign', { worker: id, zone: 'meadowfold', skill: 'hunting', node: data.zones.zones[0].harvest.hunting[0].id });
    gx.dispatch('pets/play', { pet: id, result: 'okay' });
    return [gx, id];
  };
  const [mL, mid] = moodTwin();
  const [mO] = moodTwin();
  runChunks(mL, 3 * H, 250);
  mO.catchUp(3 * H);
  const pL = mL.getState().pets.list[mid];
  const pO = mO.getState().pets.list[mid];
  check('the mood runs out after its time', pL.mood === null && pO.mood === null);
  check('mood: live ticks and catch-up give the same results', sortedJson(mL.getState().bag) === sortedJson(mO.getState().bag) && pL.level === pO.level && near(pL.xp, pO.xp, 1e-6) && near(pL.energy, pO.energy, 1e-6),
    `${sortedJson(mL.getState().bag)} vs ${sortedJson(mO.getState().bag)}`);

  // Naps: only when tired; rest faster; the first nap of a day gives Bond on waking; then back to work.
  const gn = lifeGame(1103);
  const pn = gn.getState().pets.active[0];
  const petN = () => gn.getState().pets.list[pn];
  gn.dispatch('harvest/assign', { worker: pn, zone: 'meadowfold', skill: 'hunting', node: data.zones.zones[0].harvest.hunting[0].id });
  threw = false;
  try { gn.dispatch('pets/tuckIn', { pet: pn }); } catch { threw = true; }
  check('a pet full of energy can\'t be tucked in', threw);
  gn.dispatch('dev/petEnergy', { pet: pn, energy: 20 });
  const restPlain = petRestPerHour(gn.getState(), data, petN());
  gn.dispatch('pets/tuckIn', { pet: pn });
  check('tucked in: napping and resting, rests faster', !!petN().nap && petN().resting && near(petRestPerHour(gn.getState(), data, petN()) / restPlain, data.balance.petLife.nap.restMult, 1e-9));
  const bondN = petN().bond;
  runChunks(gn, H, 1000);
  check('wakes up full with nap Bond, then works again', petN().nap === null && !petN().resting && near(petN().bond - bondN, data.balance.petLife.nap.wakeBond, 1.01) && petN().bond - bondN >= data.balance.petLife.nap.wakeBond
    && gn.getState().workers[pn].task !== null, `${petN().bond - bondN}`);
  gn.dispatch('dev/petEnergy', { pet: pn, energy: 10 });
  gn.dispatch('pets/tuckIn', { pet: pn });
  check('a second nap the same day gives no Bond', petN().nap?.bond === 0);
  gn.dispatch('dev/grant', { item: Object.keys(data.items.items).find((k) => data.items.items[k].category === 'meal' && data.items.items[k].food), qty: 1 });
  const meal = Object.keys(gn.getState().bag).find((k) => data.items.items[k.split(':')[0]]?.category === 'meal');
  gn.dispatch('pets/feed', { pet: pn, item: meal });
  check('feeding wakes a napping pet', petN().nap === null && !petN().resting);

  // The scrapbook: hearts are written as they come, and it keeps to its size (the first entry stays).
  gn.dispatch('dev/petBond', { pet: pn, bond: 0 });
  const gb = lifeGame(1104);
  const pb = gb.getState().pets.active[0];
  const petB = () => gb.getState().pets.list[pb];
  gb.dispatch('pets/pat', { pet: pb });
  gb.dispatch('dev/petBond', { pet: pb, bond: 35 });
  gb.dispatch('dev/clearPat', { pet: pb });
  gb.dispatch('pets/pat', { pet: pb });
  check('a new Bond heart goes in the scrapbook', petB().book.some((e) => e.k === 'heart' && e.n === 1));
  const maxB = data.balance.petLife.book.maxEntries;
  for (let i = 0; i < maxB + 5; i++) { gb.dispatch('dev/clearPat', { pet: pb }); gb.dispatch('dev/petBond', { pet: pb, bond: 35 }); gb.dispatch('pets/pat', { pet: pb }); }
  check('the scrapbook keeps to its size and keeps the first entry', petB().book.length === maxB && petB().book[0].k === 'home');
  check('Phase 11 state is valid', [s9, gp.getState(), gn.getState(), gb.getState()].every((x) => x && validateState(x) === null),
    [s9, gp.getState(), gn.getState(), gb.getState()].map((x) => x && validateState(x)).filter(Boolean).join(', '));
  }

  // ---- Phase 12: wishes and tricks ----
  {
  const W = data.balance.petLife.wishes;
  // Same pet, live vs catch-up: dates aside, energy to a hair (float sums differ in the last digits).
  const samePet = (a, b) => near(a.energy, b.energy, 1e-6) && JSON.stringify({ ...undated(a), energy: 0 }) === JSON.stringify({ ...undated(b), energy: 0 });
  const lifeGame = (seed = 1201) => {
    const gx = freshGame(seed);
    gx.dispatch('pets/hatchStarter', { archetype: 'wild', name: 'Pip' });
    return gx;
  };
  const hunt = (gx, id) => gx.dispatch('harvest/assign', { worker: id, zone: 'meadowfold', skill: 'hunting', node: data.zones.zones[0].harvest.hunting[0].id });

  // A wish appears after the first wait, at the same moment live and offline.
  const wishTwin = () => {
    const gx = lifeGame(1202);
    const id = gx.getState().pets.active[0];
    hunt(gx, id);
    return [gx, id];
  };
  const [wL, wid] = wishTwin();
  const [wO] = wishTwin();
  check('a new pet has no wish and waits for the first one', wL.getState().pets.list[wid].wish === null && wL.getState().pets.list[wid].wishMs === W.firstMs);
  runChunks(wL, W.firstMs - 1000, 700);
  check('no wish before the wait is over', wL.getState().pets.list[wid].wish === null);
  runChunks(wL, 2000, 700);
  wO.catchUp(W.firstMs + 1000);
  const wishL = wL.getState().pets.list[wid].wish;
  const wishO = wO.getState().pets.list[wid].wish;
  check('a wish appears when the wait is over', !!wishL && !!data.wishes.kinds.find((k) => k.id === wishL.kind));
  check('wishes: live ticks and catch-up give the same wish and pet', JSON.stringify(wishL) === JSON.stringify(wishO) && samePet(wL.getState().pets.list[wid], wO.getState().pets.list[wid]), `${JSON.stringify(wishL)} vs ${JSON.stringify(wishO)}`);

  // Only wishes the player can grant: one pet, one zone, no hearts -> only Taste (a meal they can cook) or Play.
  const gr = lifeGame(1203);
  const pr = gr.getState().pets.active[0];
  const kinds = new Set();
  let tasteOk = true;
  for (let i = 0; i < 40; i++) {
    gr.dispatch('dev/wishNow', { pet: pr });
    gr.advance(10);
    const w = gr.getState().pets.list[pr].wish;
    if (!w) continue;
    kinds.add(w.kind);
    if (w.kind === 'taste') tasteOk = tasteOk && data.recipes.recipes.some((r) => r.station === 'kitchen' && r.output === w.item && (r.level || 1) <= gr.getState().skills.cooking.level);
  }
  check('only grantable wishes roll (one pet, one zone, no hearts)', kinds.size > 0 && [...kinds].every((k) => k === 'taste' || k === 'play') && tasteOk, [...kinds].join(','));

  // Letting a wish go costs nothing; the next one comes after the wait.
  const gw = lifeGame(1204);
  const pw = gw.getState().pets.active[0];
  const petW = () => gw.getState().pets.list[pw];
  petW().wish = { kind: 'play', line: 0 };
  const bondW = petW().bond;
  gw.dispatch('pets/letWishGo', { pet: pw });
  check('letting a wish go costs nothing', petW().wish === null && petW().bond === bondW && petW().wishMs === W.waitMs);

  // A Play wish comes true with a game: wish Bond on top of the game's, a scrapbook line, the achievement.
  petW().wish = { kind: 'play', line: 1 };
  gw.dispatch('pets/play', { pet: pw, result: 'okay' });
  check('a Play wish comes true with a game', petW().wish === null && near(petW().bond - bondW, data.balance.petLife.play.bond.okay + W.bond, 1e-9)
    && petW().book.some((e) => e.k === 'wish' && e.kind === 'play') && gw.getState().stats.wishesGranted === 1 && !!gw.getState().achievements.done.wish_come_true);

  // A Taste wish: hand-feed the dish, even at full energy.
  const dish = data.recipes.recipes.find((r) => r.station === 'kitchen' && data.items.items[r.output]?.category === 'meal').output;
  petW().wish = { kind: 'taste', item: dish, line: 0 };
  gw.dispatch('dev/grant', { item: dish, qty: 1, quality: 'fine' });
  gw.dispatch('pets/feed', { pet: pw, item: `${dish}:fine` });
  check('a Taste wish comes true by hand-feeding the dish (even when full)', petW().wish === null && petW().mood?.kind && gw.getState().stats.wishesGranted === 2);

  // An Outing wish: one hour of work in the zone; live = catch-up (Bond, mood and gift land on a step's end).
  const outTwin = () => {
    const gx = lifeGame(1205);
    const id = gx.getState().pets.active[0];
    hunt(gx, id);
    gx.getState().pets.list[id].wish = { kind: 'outing', zone: 'meadowfold', line: 0, progressMs: 0 };
    return [gx, id];
  };
  const [oL, oid] = outTwin();
  const [oO] = outTwin();
  runChunks(oL, 3 * H, 333);
  oO.catchUp(3 * H);
  const poL = oL.getState().pets.list[oid];
  const poO = oO.getState().pets.list[oid];
  check('an Outing wish comes true after an hour of work there', poL.wish?.kind !== 'outing' && poL.book.some((e) => e.k === 'wish' && e.kind === 'outing' && e.zone === 'meadowfold'));
  check('Outing wish: live ticks and catch-up agree', samePet(poL, poO) && sortedJson(oL.getState().bag) === sortedJson(oO.getState().bag),
    `${poL.mood?.msLeft} vs ${poO.mood?.msLeft}`);

  // A Buddy wish: only while both pets work in the same zone; a buddy that leaves ends the wish.
  const gd = lifeGame(1206);
  gd.dispatch('dev/addPet', { archetype: 'sprout', name: 'Bram' });
  const [pa, pbud] = gd.getState().pets.active;
  hunt(gd, pa);
  const petA = () => gd.getState().pets.list[pa];
  petA().wish = { kind: 'buddy', buddy: pbud, line: 0, progressMs: 0 };
  runChunks(gd, H / 2, 1000);
  check('a Buddy wish waits while the buddy is not working beside it', petA().wish?.progressMs === 0);
  hunt(gd, pbud);
  runChunks(gd, 2 * H, 1000);
  check('a Buddy wish comes true after an hour side by side', petA().wish?.kind !== 'buddy' && petA().book.some((e) => e.k === 'wish' && e.kind === 'buddy' && e.buddy === 'Bram'));
  petA().wish = { kind: 'buddy', buddy: pbud, line: 0, progressMs: 0 };
  gd.dispatch('pets/release', { pet: pbud });
  gd.advance(1000);
  check('a Buddy wish ends when the buddy leaves', petA().wish === null && petA().wishMs > 0);

  // Tricks: one per Bond heart, one lesson a day, learned after the set number of lessons.
  const gt = lifeGame(1207);
  const pt = gt.getState().pets.active[0];
  const petT = () => gt.getState().pets.list[pt];
  threw = false;
  try { gt.dispatch('pets/teach', { pet: pt, trick: 'spin' }); } catch { threw = true; }
  check('no tricks before the first Bond heart', threw);
  gt.dispatch('dev/petBond', { pet: pt, bond: data.balance.pets.bond.hearts[0] });
  petT().wish = { kind: 'trick', line: 0 };
  gt.dispatch('pets/teach', { pet: pt, trick: 'spin' });
  check('a lesson counts and grants a Trick wish', petT().tricks.spin === 1 && petT().wish === null && gt.getState().stats.lessons === 1);
  threw = false;
  try { gt.dispatch('pets/teach', { pet: pt, trick: 'spin' }); } catch { threw = true; }
  check('one lesson a day', threw);
  for (let i = 1; i < data.balance.petLife.tricks.sessions; i++) { gt.dispatch('dev/clearPlay', { pet: pt }); gt.dispatch('pets/teach', { pet: pt }); }
  check('a trick is learned after its lessons', petT().tricks.spin === data.balance.petLife.tricks.sessions && petT().book.some((e) => e.k === 'trick' && e.trick === 'spin')
    && gt.getState().stats.tricksLearned === 1 && !!gt.getState().achievements.done.good_trick);
  gt.dispatch('dev/clearPlay', { pet: pt });
  threw = false;
  try { gt.dispatch('pets/teach', { pet: pt, trick: 'hop' }); } catch { threw = true; }
  check('one heart, one trick', threw);
  check('Phase 12 state is valid', [wL.getState(), gw.getState(), oL.getState(), gd.getState(), gt.getState()].every((x) => validateState(x) === null),
    [wL.getState(), gw.getState(), oL.getState(), gd.getState(), gt.getState()].map((x) => validateState(x)).filter(Boolean).join(', '));
  }
} catch (err) {
  failed++;
  lines.push(`FAIL  crashed: ${err.stack || err}`);
}
lines.push('', failed ? `${failed} FAILED` : 'ALL PASSED');
out.innerHTML = lines.map((l) => `<span class="${l.startsWith('FAIL') || l.includes('FAILED') ? 'fail' : 'pass'}">${l.replace(/</g, '&lt;')}</span>`).join('\n');
window.__testResult = { failed, lines };
</script>
</body>
</html>
