<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetCraft Art Catalog</title>
<link rel="stylesheet" href="catalog.css">
</head>
<body>
<header class="toolbar">
  <h1>Art Catalog</h1>
  <input id="filter" type="search" placeholder="Filter by path..." autocomplete="off">
  <select id="category" aria-label="Category"><option value="">All categories</option></select>
  <span id="counts" class="counts"></span>
</header>
<main id="main"><p class="msg">Loading...</p></main>
<div id="overlay" class="overlay" hidden>
  <div class="panel">
    <div class="viewer"><img id="ov-img" alt=""></div>
    <p id="ov-path" class="path"></p>
    <p id="ov-dim" class="dim"></p>
    <div class="actions">
      <button id="ov-copy" type="button">Copy path</button>
      <a id="ov-open" class="btn" target="_blank" rel="noopener">Open full size</a>
      <button id="ov-close" type="button">Close</button>
    </div>
  </div>
</div>
<script type="module" src="catalog.js"></script>
</body>
</html>
